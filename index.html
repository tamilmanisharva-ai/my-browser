<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cloud Browser</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Browser Control Header -->
    <div class="browser-header">
        <button onclick="goHome()">🏠 Home</button>
        <button onclick="refreshPage()">⟳ Refresh</button>
        <input type="text" id="url-input" value="" placeholder="Type search words OR paste a direct website link here...">
        <button onclick="navigate()">Go / Search</button>
    </div>

    <!-- Main Tab Window Display Area -->
    <div class="browser-content">
        <iframe id="web-display" src="https://duckduckgo.com"></iframe>
    </div>

    <script>
        const iframe = document.getElementById('web-display');
        const urlInput = document.getElementById('url-input');

        urlInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                navigate();
            }
        });

        function navigate() {
            let input = urlInput.value.trim();
            if (!input) return;

            // If it looks like a direct link (contains a dot and no spaces)
            if (input.includes('.') && !input.includes(' ')) {
                // Ensure it has the proper protocol layout
                if (!input.startsWith('http://') && !input.startsWith('https://')) {
                    input = 'https://' + input;
                }
                urlInput.value = input;
                // Force-loads the direct web link directly inside your current tab frame
                iframe.src = input;
            } else {
                // Otherwise, process it as a clean text search query
                iframe.src = "https://duckduckgo.com" + encodeURIComponent(input);
            }
        }

        function refreshPage() {
            iframe.src = iframe.src;
        }

        function goHome() {
            urlInput.value = "";
            iframe.src = "https://duckduckgo.com";
        }
    </script>
</body>
</html>
