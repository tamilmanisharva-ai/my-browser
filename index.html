<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cloud Browser</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Browser Control Header Layout -->
    <div class="browser-header">
        <button onclick="goHome()">🏠 Home</button>
        <button onclick="refreshPage()">⟳ Refresh</button>
        <input type="text" id="url-input" value="" placeholder="Type a search topic or keyword here...">
        <button onclick="navigate()">Go / Search</button>
    </div>

    <!-- Main Tab Window Display Area -->
    <div class="browser-content">
        <iframe id="web-display" src="about:blank"></iframe>
    </div>

    <script>
        const iframe = document.getElementById('web-display');
        const urlInput = document.getElementById('url-input');

        // Render an open starter layout directly inside our frame to avoid empty white blocks
        window.onload = function() {
            goHome();
        };

        urlInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                navigate();
            }
        });

        function navigate() {
            let input = urlInput.value.trim();
            if (!input) return;

            // Strip out clean protocols if the user types them out
            input = input.replace('https://', '').replace('http://', '');

            // Clean query calculation processing
            let searchUrl = "https://bing.com" + encodeURIComponent(input);
            
            // Render the engine inside our workspace layout
            iframe.src = searchUrl;
        }

        function refreshPage() {
            iframe.src = iframe.src;
        }

        function goHome() {
            urlInput.value = "";
            let welcomeHTML = `
                <html>
                <body style="background-color: #202124; color: white; font-family: Arial, sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 80vh; margin: 0;">
                    <h1 style="font-size: 36px; margin-bottom: 10px;">My Cloud Workspace</h1>
                    <p style="color: #9aa0a6; font-size: 16px;">Type a topic into the search bar above to begin browsing securely.</p>
                </body>
                </html>
            `;
            iframe.src = "data:text/html;charset=utf-8," + encodeURIComponent(welcomeHTML);
        }
    </script>
</body>
</html>
