<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cloud Browser</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Browser Control Header -->
    <div class="browser-header">
        <button onclick="goHome()">🏠 Home</button>
        <button onclick="refreshPage()">⟳ Refresh</button>
        <input type="text" id="url-input" value="" placeholder="Type a search word or full website url...">
        <button onclick="navigate()">Go / Search</button>
    </div>

    <!-- Main Tab Window Display Area -->
    <div class="browser-content">
        <iframe id="web-display" src="https://duckduckgo.com"></iframe>
    </div>

    <script>
        const iframe = document.getElementById('web-display');
        const urlInput = document.getElementById('url-input');

        urlInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                navigate();
            }
        });

        function navigate() {
            let input = urlInput.value.trim();
            if (!input) return;

            // FIX: If it looks like a real domain link (e.g. google.com, wikipedia.org)
            if (input.includes('.') && !input.includes(' ')) {
                if (!input.startsWith('http://') && !input.startsWith('https://')) {
                    input = 'https://' + input;
                }
                urlInput.value = input;
                iframe.src = input;
            } else {
                // FIX: If it's just a regular word (like 'google' or 'cats'), search it properly
                iframe.src = "https://duckduckgo.com" + encodeURIComponent(input);
            }
        }

        function refreshPage() {
            iframe.src = iframe.src;
        }

        function goHome() {
            urlInput.value = "";
            iframe.src = "https://duckduckgo.com";
        }
    </script>
</body>
</html>
