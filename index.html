<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cloud Workspace</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Navigation Bar Layout -->
    <div class="browser-header">
        <div style="color: white; font-weight: bold; margin-right: 15px; font-size: 16px;">🌐 CloudPortal</div>
        <input type="text" id="url-input" value="" placeholder="Type a search topic OR paste a direct URL link here...">
        <button onclick="navigate()">Launch Tab</button>
    </div>

    <!-- Main Workspace Dashboard Grid -->
    <div class="browser-content" style="background-color: #202124; padding: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 85vh; color: white; font-family: Arial, sans-serif;">
        
        <h1 style="font-size: 42px; margin-bottom: 10px; color: #8ab4f8;">My Workspace Hub</h1>
        <p style="color: #9aa0a6; font-size: 16px; margin-bottom: 30px; text-align: center; max-width: 500px;">
            Type anything above and hit launch. Links and search setups will automatically open in clean workspace tabs bypassing browser blocks.
        </p>

        <!-- Built-in Quick Launch Bookmarks Dashboard -->
        <h3 style="margin-bottom: 15px; align-self: flex-start; max-width: 600px; width: 100%; border-bottom: 1px solid #3c4043; padding-bottom: 10px;">Quick Launch Workspaces</h3>
        <div style="display: flex; gap: 15px; flex-wrap: wrap; width: 100%; max-width: 600px;">
            <button onclick="launchQuick('https://www.google.com')" style="padding: 12px 20px; background-color: #303134; border: 1px solid #3c4043; color: white; border-radius: 8px; cursor: pointer; font-weight: bold;">Google</button>
            <button onclick="launchQuick('https://wikipedia.org')" style="padding: 12px 20px; background-color: #303134; border: 1px solid #3c4043; color: white; border-radius: 8px; cursor: pointer; font-weight: bold;">Wikipedia</button>
            <button onclick="launchQuick('https://github.com')" style="padding: 12px 20px; background-color: #303134; border: 1px solid #3c4043; color: white; border-radius: 8px; cursor: pointer; font-weight: bold;">GitHub</button>
        </div>

    </div>

    <script>
        const urlInput = document.getElementById('url-input');

        // Watch for enter key submissions
        urlInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                navigate();
            }
        });

        function navigate() {
            let input = urlInput.value.trim();
            if (!input) return;

            // Process text as a clean target link or a search query
            if (input.includes('.') && !input.includes(' ')) {
                if (!input.startsWith('http://') && !input.startsWith('https://')) {
                    input = 'https://' + input;
                }
                window.open(input, '_blank');
            } else {
                // If it is just a search word, compile it using an unblocked target search query path
                window.open("https://google.com" + encodeURIComponent(input), '_blank');
            }
        }

        // Dedicated helper function for dashboard bookmark launcher
        function launchQuick(targetUrl) {
            window.open(targetUrl, '_blank');
        }
    </script>
</body>
</html>
